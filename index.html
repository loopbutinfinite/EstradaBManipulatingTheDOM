<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulating The DOM Challenge</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>

<body>
    <header>
        <h1 id="page-title">Let's Play with JavaScript!</h1>
        <p id="subtitle">Click the buttons to alter the page.</p>
    </header>

    <main>
        <div class="controls">
            <button id="change-title-button">Change Title Text</button>
            <button id="color-button">Change Background Color to Purple</button>
            <button id="back-to-white-button">Change Background Color to White</button>
            <button id="change-font-size">Change the font size</button>
            <button id="add-image">Add an image</button>
            <button id="add-css-to-image">Click to apply CSS to image with JS</button>
            <button id="change-font">Change the font of the page</button>
            <button id="change-text-color">Change the color of the text</button>
            <button id="italicize-text">Italicize the text</button>
            <button id="bold-text">Bold the subtitle text</button>
            <button id="underline-text">Underline the text</button>
            <button id="add-shadow-button">Add Shadow to text</button>
        </div>

        <!-- make a div to target in app.js so that we can add the image here. -->
        <div id="image-container">

        </div>
    </main>



    <script src="./scripts/app.js"></script>
</body>

</html>
